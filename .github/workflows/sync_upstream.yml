name: Sync with Upstream

on:
  schedule:
    - cron: '0 12 * * *' # Run daily at 12:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

# Paths whose merge conflicts are safe to auto-resolve by regeneration. These
# are produced by `tool/generate.dart`, so any conflict in them is throwaway:
# we take our side just to clear the markers and then regenerate on top.
env:
  # Java has no `.gen` suffix; AlternateLanguageTestPlugin.java is excluded in the loop.
  GENERATED_FILE_REGEX: '/alternate_language_test_plugin/android/src/main/java/.*\.java$|\.gen\.(dart|swift|kt|kts|java|h|m|mm|cc|cpp)$|\.gen\.(ffi|jni)\.dart$|[^/]+\.g\.(dart|swift|kt|java|h|m|mm)$|\.g\.(ffi|jni)\.dart$|/tool/golubets/[^/]+_(ffigen|jnigen)_config\.dart$'
  # Fork-owned files: upstream edits to them are never wanted verbatim; the PR
  # report lists upstream CHANGELOG entries so they can be ported by hand.
  OURS_FILE_REGEX: '^packages/golubets/(README|CHANGELOG)\.md$'

jobs:
  sync-upstream:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GPAT }}

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --- Toolchain: mirror the `tests` job in ci.yml so we can regenerate and
      # --- run the same analyze/format/test checks the PR will be graded on.
      - name: Read Flutter version from file
        id: read_flutter_version
        run: echo "FLUTTER_VERSION=$(cat .ci/flutter_stable.version)" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install native build/format dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format cmake ninja-build curl libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev

      - name: Clone upstream repository
        run: git clone https://github.com/flutter/packages.git /tmp/upstream-temp

      - name: Apply git filter-repo to upstream
        run: |
          cd /tmp/upstream-temp
          git filter-repo --path packages/pigeon --path LICENSE --path README.md --path script --path .gitignore --path .github --path .ci --path .gitattributes --path analysis_options.yaml --path customer_testing.bat --path customer_testing.sh --path .clang-format --path .ci.yaml --path CONTRIBUTING.md --path .ci/legacy_project --path script/tool --force

      - name: Check for existing PR
        id: check-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GPAT }}
        run: |
          echo "Checking for existing PR with label 'sync upstream' in ${{ github.repository }}"
          PR_JSON=$(gh pr list --repo "${{ github.repository }}" --label "sync upstream" --state open --json number,headRefName 2>/dev/null || echo "")
          PR_DATA=$(echo "$PR_JSON" | jq -r '.[0] | select(.number) | "\(.number):\(.headRefName)"' 2>/dev/null || echo "")
          if [ -n "$PR_DATA" ]; then
            echo "Found existing PR: $PR_DATA"
            echo "number=$(echo "$PR_DATA" | cut -d':' -f1)" >> "$GITHUB_OUTPUT"
            echo "headRefName=$(echo "$PR_DATA" | cut -d':' -f2)" >> "$GITHUB_OUTPUT"
          else
            echo "No existing PR found with label 'sync upstream'."
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "headRefName=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or checkout sync branch
        run: |
          if [ -n "${{ steps.check-pr.outputs.headRefName }}" ]; then
            echo "Checking out existing PR branch: ${{ steps.check-pr.outputs.headRefName }}"
            git checkout "${{ steps.check-pr.outputs.headRefName }}"
            git reset --hard origin/${{ github.ref_name }} # Reset to main before applying new changes
          else
            echo "Creating new branch: sync-upstream-$(date +%Y%m%d-%H%M%S)"
            git checkout -b "sync-upstream-$(date +%Y%m%d-%H%M%S)"
          fi

      - name: Add filtered upstream as remote
        run: |
          git remote add filtered-upstream /tmp/upstream-temp
          git fetch filtered-upstream main

      # Three-way merge with *both* the merge base and upstream rewritten into
      # golubets layout/naming (see prepare_upstream.sh). Ours vs base then only
      # differs by real fork changes, so rename noise doesn't conflict and new
      # upstream code arrives already renamed. The commit still records the
      # original upstream commit as parent, so the next merge base stays correct.
      - name: Merge filtered upstream changes
        id: merge
        continue-on-error: true
        run: |
          BASE=$(git merge-base HEAD filtered-upstream/main)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          normalize() {
            git worktree add -q --detach "$1" "$2"
            bash .github/scripts/prepare_upstream.sh "$1"
            git -C "$1" rev-parse HEAD
          }
          NORM_BASE=$(normalize /tmp/norm-base "$BASE")
          echo "norm_base=$NORM_BASE" >> "$GITHUB_OUTPUT"
          NORM_UP=$(normalize /tmp/norm-up filtered-upstream/main)
          echo "norm_up=$NORM_UP" >> "$GITHUB_OUTPUT"

          git -c merge.conflictStyle=zdiff3 merge-tree --write-tree --name-only \
            --merge-base="$NORM_BASE" HEAD "$NORM_UP" > /tmp/merge_tree.txt || true
          TREE=$(head -n1 /tmp/merge_tree.txt)
          # Conflicted paths follow the tree id, up to the first blank line.
          awk 'NR>1 && NF==0 {exit} NR>1' /tmp/merge_tree.txt | sort -u > /tmp/all_conflicts.txt

          # Record upstream as second parent, then take the merged tree.
          git merge --no-commit --no-ff -s ours filtered-upstream/main
          git read-tree -u --reset "$TREE"

          if [ -s /tmp/all_conflicts.txt ]; then
            echo "raw_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "raw_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      # Generated-file conflicts are noise: take our side to clear the markers,
      # they get overwritten by regeneration in the next step. Whatever remains
      # is a *real* source conflict a human must resolve.
      - name: Auto-resolve generated-file conflicts
        id: autoresolve
        continue-on-error: true
        run: |
          : > /tmp/generated_conflicts.txt
          : > /tmp/source_conflicts.txt
          if [ -s /tmp/all_conflicts.txt ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              # Deleted by us, modified upstream: keep it deleted.
              if ! git cat-file -e "HEAD:$file" 2>/dev/null \
                && git cat-file -e "${{ steps.merge.outputs.norm_base }}:$file" 2>/dev/null; then
                git rm -q --ignore-unmatch -- "$file"
                echo "$file (kept deleted)" >> /tmp/generated_conflicts.txt
                continue
              fi
              if echo "$file" | grep -Eq "$GENERATED_FILE_REGEX|$OURS_FILE_REGEX" \
                && [[ "$file" != */AlternateLanguageTestPlugin.java ]]; then
                # Index is clean after merge-tree; markers live in the file.
                git checkout HEAD -- "$file" 2>/dev/null \
                  || git checkout "${{ steps.merge.outputs.norm_up }}" -- "$file" 2>/dev/null \
                  || true
                echo "$file" >> /tmp/generated_conflicts.txt
              else
                echo "$file" >> /tmp/source_conflicts.txt
              fi
            done < /tmp/all_conflicts.txt
          fi
          if [ -s /tmp/source_conflicts.txt ]; then
            echo "source_conflicts=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      # Only safe to build/regenerate when no *source* conflict markers remain.
      - name: Regenerate, format and verify
        id: verify
        if: steps.autoresolve.outputs.source_conflicts == 'false'
        continue-on-error: true
        run: |
          status() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          chmod +x .ci/scripts/*.sh || true

          if .ci/scripts/prepare_tool.sh && .ci/scripts/tool_runner.sh fetch-deps; then
            status deps ok
          else
            status deps fail
          fi

          # Regenerate all generated pigeon/golubets output so it matches the
          # merged generators. Skip swift-format (not available on Linux).
          if (cd packages/golubets && dart run tool/generate.dart --no-format); then
            status regen ok
          else
            status regen fail
          fi
          dart ./script/tool/bin/flutter_plugin_tools.dart format --no-swift || true

          if dart ./script/tool/bin/flutter_plugin_tools.dart analyze; then
            status analyze ok
          else
            status analyze fail
          fi

          if dart ./script/tool/bin/flutter_plugin_tools.dart format --fail-on-change --no-swift; then
            status format ok
          else
            status format fail
          fi

          if dart ./script/tool/bin/flutter_plugin_tools.dart dart-test; then
            status darttest ok
          else
            status darttest fail
          fi

          git add -A || true

      # Heuristic for the recurring "upstream migrated X.gradle -> X.gradle.kts
      # but the old Groovy file lingered" class of breakage.
      - name: Detect leftover duplicate config files
        id: dups
        continue-on-error: true
        run: |
          : > /tmp/dup_files.txt
          while IFS= read -r kts; do
            groovy="${kts%.kts}"
            if [ -f "$groovy" ]; then
              echo "$groovy (superseded by $kts)" >> /tmp/dup_files.txt
            fi
          done < <(git ls-files '*.gradle.kts')
          if [ -s /tmp/dup_files.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR report
        id: report
        run: |
          REPORT=/tmp/pr_body.md
          {
            echo "Automated sync with upstream \`flutter/packages\` (pigeon paths)."
            echo ""

            if [ "${{ steps.autoresolve.outputs.source_conflicts }}" = "true" ]; then
              echo "## ❌ Source conflicts — manual resolution required"
              echo ""
              echo "Resolve these preferring our \`golubets\` implementation while consuming upstream updates:"
              echo ""
              sed 's/^/- [ ] `/; s/$/`/' /tmp/source_conflicts.txt
              echo ""
            else
              echo "## ✅ No source conflicts"
              echo ""
            fi

            if [ -s /tmp/generated_conflicts.txt ]; then
              echo "## 🔁 Auto-resolved (generated files regenerated, fork-owned docs kept)"
              echo ""
              echo "<details><summary>$(wc -l < /tmp/generated_conflicts.txt) file(s)</summary>"
              echo ""
              sed 's/^/- `/; s/$/`/' /tmp/generated_conflicts.txt
              echo ""
              echo "</details>"
              echo ""
            fi

            BASE="${{ steps.merge.outputs.base }}"
            if [ -n "$BASE" ]; then
              echo "## 📜 Upstream pigeon changes in this sync"
              echo ""
              echo "<details><summary>Commits</summary>"
              echo ""
              git log --format='- %s' "$BASE..filtered-upstream/main" -- packages/pigeon
              echo ""
              echo "</details>"
              echo ""
              echo "<details><summary>New upstream CHANGELOG entries (port to ours)</summary>"
              echo ""
              echo '```'
              git diff "$BASE" filtered-upstream/main -- packages/pigeon/CHANGELOG.md \
                | grep '^+' | grep -v '^+++' | sed 's/^+//'
              echo '```'
              echo ""
              echo "</details>"
              echo ""
            fi

            echo "## Post-merge checks"
            echo ""
            icon() { case "$1" in ok) echo "✅";; fail) echo "❌";; *) echo "⏭️ skipped";; esac; }
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Dependencies | $(icon '${{ steps.verify.outputs.deps }}') |"
            echo "| Regenerate code | $(icon '${{ steps.verify.outputs.regen }}') |"
            echo "| Analyze (\`--fatal-infos\`) | $(icon '${{ steps.verify.outputs.analyze }}') |"
            echo "| Format (\`--no-swift\`) | $(icon '${{ steps.verify.outputs.format }}') |"
            echo "| Dart unit tests | $(icon '${{ steps.verify.outputs.darttest }}') |"
            echo ""
            if [ "${{ steps.autoresolve.outputs.source_conflicts }}" = "true" ]; then
              echo "> Checks were skipped because source conflicts must be resolved first. Re-run after resolving."
              echo ""
            fi

            if [ "${{ steps.dups.outputs.found }}" = "true" ]; then
              echo "## ⚠️ Leftover duplicate config files"
              echo ""
              echo "Upstream likely migrated these to Kotlin DSL. Delete the Groovy versions if obsolete:"
              echo ""
              sed 's/^/- [ ] `/; s/ (superseded.*$//; s/$/`/' /tmp/dup_files.txt
              echo ""
            fi

            echo "## Manual review checklist (native code the CI sync job can't build)"
            echo ""
            echo "These broke on previous syncs and are **not** covered by the checks above:"
            echo "- [ ] Hand-written \`TestPlugin\` conforms to new \`HostIntegrationCoreApi\` methods (Swift \`darwin/.../TestPlugin.swift\`, Windows \`windows/test_plugin.{h,cpp}\`)."
            echo "- [ ] Linux GObject hand-written tests use \`Golubets\`-prefixed symbols, not \`Pigeon\` (\`linux/test/*.cc\`)."
            echo "- [ ] Gradle wrapper versions (\`gradle-wrapper.properties\`) match upstream AGP requirements."
            echo "- [ ] JDK / Kotlin / Gradle plugin version bumps from upstream are reflected in our build config."
            echo "- [ ] Brittle test assertions (e.g. broad \`isNot(contains('try'))\`) didn't regress."
            echo "- [ ] Auto-merged hunks didn't silently adopt upstream behaviour we diverge from (e.g. pigeon 28 made async/suspend the default; check test expectations and \`TestPlugin\` signatures)."
          } > "$REPORT"

          if [ "${{ steps.autoresolve.outputs.source_conflicts }}" = "true" ]; then
            echo "title=Sync with upstream flutter/packages (Conflicts)" >> "$GITHUB_OUTPUT"
          else
            echo "title=Sync with upstream flutter/packages" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        id: commit
        run: |
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            if [ "${{ steps.autoresolve.outputs.source_conflicts }}" = "true" ]; then
              git commit -m "Sync with upstream flutter/packages (conflicts detected)" || true
            else
              git commit -m "Sync with upstream flutter/packages (generated code regenerated)" || true
            fi
            git push --force origin HEAD
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.commit.outputs.committed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GPAT }}
        run: |
          if [ -n "${{ steps.check-pr.outputs.number }}" ]; then
            echo "Updating PR #${{ steps.check-pr.outputs.number }}"
            gh pr edit "${{ steps.check-pr.outputs.number }}" \
              --repo "${{ github.repository }}" \
              --title "${{ steps.report.outputs.title }}" \
              --body-file /tmp/pr_body.md \
              --add-label "sync upstream"
          else
            echo "Creating new PR"
            gh pr create \
              --repo "${{ github.repository }}" \
              --title "${{ steps.report.outputs.title }}" \
              --base main --head "$(git rev-parse --abbrev-ref HEAD)" \
              --assignee feduke-nukem --label "sync upstream" \
              --body-file /tmp/pr_body.md
          fi

      - name: Clean up temporary upstream
        if: always()
        run: |
          git worktree remove --force /tmp/norm-base 2>/dev/null || true
          git worktree remove --force /tmp/norm-up 2>/dev/null || true
          rm -rf /tmp/upstream-temp
